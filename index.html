    <script>
      // Prevent benign dev-server WebSocket rejections from bubbling as uncaught errors in browser console
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
        if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
